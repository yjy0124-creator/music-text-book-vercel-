<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자기소개</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);font-family:'Segoe UI',sans-serif;}
  .card{background:#fff;padding:40px 50px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;max-width:360px;}
  .avatar{width:100px;height:100px;border-radius:50%;background:#2575fc;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px;}
  h1{margin:0 0 5px;color:#333;}
  p.role{color:#777;margin:0 0 20px;}
  p.desc{color:#555;line-height:1.6;}
  .tags{margin-top:20px;}
  .tags span{display:inline-block;background:#eef2ff;color:#2575fc;padding:5px 12px;border-radius:20px;font-size:13px;margin:4px;}
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">🙂</div>
    <h1>홍길동</h1>
    <p class="role">개발자</p>
    <p class="desc">안녕하세요! 저는 새로운 것을 배우고 만드는 것을 좋아하는 개발자입니다.</p>
    <div class="tags">
      <span>Python</span><span>JavaScript</span><span>Web</span>
    </div>
  </div>
</body>
</html>
