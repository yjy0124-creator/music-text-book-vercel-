<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자기소개</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f4f8;
      color: #1f2937;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      margin: 16px 0;
      line-height: 1.6;
    }
    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요!</h1>
    <p>저는 웹앱을 좋아하는 사람입니다. 간단한 소개 페이지를 만들었어요.</p>
    <p>주로 프론트엔드 개발과 디자인에 관심이 있고, 새로운 것을 배우는 걸 즐깁니다.</p>
    <button onclick="alert('만나서 반가워요!')">인사하기</button>
  </div>
</body>
</html>
